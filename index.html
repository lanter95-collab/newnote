        function executeFilter() {
            const filterText = document.getElementById('searchInput').value;
            const searchTerms = filterText.toLowerCase().split(' ').filter(t => t !== '');
            const searchSelectVal = document.getElementById('searchCategoryFilter') ? document.getElementById('searchCategoryFilter').value : '';
            activeCategoryFilter = searchSelectVal;

            filteredNotes = notes.filter(n => {
                if (isReminderNote(n)) return false;
                if (searchSelectVal && n.category !== searchSelectVal) return false;
                if (searchTerms.length === 0) return true;
                const searchableContent = n.richText ? stripTags(n.content) : n.content;
                const fullText = (searchableContent + ' ' + (n.keywords || '') + ' ' + (n.category || '')).toLowerCase();
                return searchTerms.every(term => fullText.includes(term));
            });

            renderNotesList();
        }

        function loadNextPage() {
            currentPage++;
            renderNotesList();
        }

        function highlightText(text, keywordStr) {
            if (!keywordStr || !text) return text;
            const terms = keywordStr.toLowerCase().split(' ').filter(t => t !== '');
            if (terms.length === 0) return text;
            
            let escapedTerms = terms.map(t => t.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&'));
            let regex = new RegExp(`(${escapedTerms.join('|')})`, 'gi');
            return text.replace(regex, '<span class="highlight">$1</span>');
        }

        function processContentLinks(text) {
            if (!text) return { html: '', ytHtml: '' };
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let ytHtml = '';
            
            const urls = text.match(urlRegex);
            if (urls) {
                for (let url of urls) {
                    let videoId = '';
                    if (url.includes('youtube.com/watch')) {
                        const urlObj = new URL(url);
                        videoId = urlObj.searchParams.get('v');
                    } else if (url.includes('youtu.be/')) {
                        videoId = url.split('youtu.be/')[1]?.split(/[?#]/)[0];
                    }
                    
                    if (videoId) {
                        ytHtml += `
                            <div class="yt-preview-container" onclick="event.stopPropagation(); window.open('${url}', '_blank');">
                                <img src="https://img.youtube.com/vi/${videoId}/mqdefault.jpg" class="yt-thumb" alt="YouTube 預覽圖">
                                <div class="yt-play-icon">▶</div>
                            </div>
                        `;
                    }
                }
            }

            const htmlWithLinks = text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" onclick="event.stopPropagation();">${url}</a>`;
            });

            return { html: htmlWithLinks, ytHtml: ytHtml };
        }

        function countTodoItems(content) {
            if (!content) return { total: 0, checked: 0 };
            const lines = content.split('\n');
            let total = 0;
            let checked = 0;
            lines.forEach(line => {
                if (line.includes('□ ') || line.includes('■ ')) {
                    total++;
                    if (line.includes('■ ')) checked++;
                }
            });
            return { total, checked };
        }

        function formatFirstLineBold(htmlText) {
            const lines = htmlText.split('\n');
            if (lines.length > 0) {
                lines[0] = `<span class="first-line-bold">${lines[0]}</span>`;
            }
            return lines.join('\n');
        }

        function parseTodoListHtml(contentHtml, noteId) {
            const lines = contentHtml.split('\n');
            let hasTodo = false;
            const isTodoLine = [];
            const parsedLines = lines.map((line, index) => {
                if (line.includes('□ ') || line.includes('■ ')) {
                    hasTodo = true;
                    isTodoLine[index] = true;
                    const isChecked = line.includes('■ ');
                    const cleanText = line.replace('□ ', '').replace('■ ', '');
                    const completedClass = isChecked ? 'todo-completed' : '';
                    const innerText = index === 0 ? `<span class="first-line-bold">${cleanText}</span>` : cleanText;
                    return `<div class="todo-item-row" onclick="event.stopPropagation();"><input type="checkbox" class="todo-checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTodoItemStatus('${noteId}', ${index}, this.checked)"><span class="todo-text-span ${completedClass}">${innerText}</span></div>`;
                }
                if (hasTodo && line.trim() === '') {
                    return '';
                }
                return index === 0 ? `<span class="first-line-bold">${line}</span>` : line;
            });
            if (!hasTodo) return parsedLines.join('\n');
            // 有核取方塊時，一般文字行補上換行，避免多行文字黏在一起
            return parsedLines.map((p, i) => (isTodoLine[i] || p === '') ? p : p + '\n').join('');
        }

        function toggleTodoItemStatus(noteId, lineIndex, isChecked) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;
            const lines = note.content.split('\n');
            if (lines[lineIndex]) {
                if (isChecked) {
                    lines[lineIndex] = lines[lineIndex].replace('□ ', '■ ');
                } else {
                    lines[lineIndex] = lines[lineIndex].replace('■ ', '□ ');
                }
                db.child(noteId).update({ content: lines.join('\n') });
            }
        }

        function toggleAllTodoItems(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) return;
            const lines = note.content.split('\n');
            
            let hasUnchecked = false;
            lines.forEach(line => {
                if (line.includes('□ ')) {
                    hasUnchecked = true;
                }
            });

            const newLines = lines.map(line => {
                if (hasUnchecked) {
                    return line.replace('□ ', '—').replace('—', '■ ');
                } else {
                    return line.replace('■ ', '□ ');
                }
            });

            db.child(noteId).update({ content: newLines.join('\n') });
        }

        function renderNotesList() {
            const container = document.getElementById('note-container');
            if (currentPage === 1) container.innerHTML = '';
            
            const searchFilterText = document.getElementById('searchInput').value;
            const totalVisibleCount = currentPage * PAGE_SIZE;
            const notesToRender = filteredNotes.slice((currentPage - 1) * PAGE_SIZE, totalVisibleCount);
            
            notesToRender.forEach((note) => {
                const div = document.createElement('div');
                div.className = 'note-card';
                div.id = `note-${note.id}`;
                div.ondblclick = () => openEditModal(note.id);
                
                const catHtml = note.category ? `<div class="category-header"><span class="category-tag" onclick="event.stopPropagation(); setCategoryFilter('${note.category}')">${note.category}</span></div>` : '';
                const tagsArr = (note.keywords || '').split(' ').filter(k => k !== '');
                const tagsHtml = tagsArr.map(k => `<span class="tag" onclick="event.stopPropagation(); setSearch('${k}')">#${highlightText(k, searchFilterText)}</span>`).join('');
                
                const noteImages = note.images || [];
                const imgsHtml = noteImages.map((img, idx) => {
                    return `<img src="${img}" class="note-img" onclick="event.stopPropagation(); openViewer(${idx}, ${JSON.stringify(noteImages).replace(/"/g, '&quot;')})">`;
                }).join('');
                
                let relatedHtml = '';
                if (!shareId && tagsArr.length > 0) { // 分享模式下不載入相關推薦
                    const related = notes.filter(other => {
                        if (other.id === note.id) return false;
                        const otherTags = (other.keywords || '').split(' ');
                        return tagsArr.some(t => otherTags.includes(t));
                    }).slice(0, 3);
                    if (related.length > 0) {
                        relatedHtml = `<div class="related-section"><div class="related-label">🔗 相關筆記：</div>` + 
                            related.map(r => {
                                const plainSnippet = r.richText ? stripTags(r.content) : r.content;
                                return `<div class="related-link" onclick="event.stopPropagation(); scrollToNote('${r.id}')">${highlightText(plainSnippet.substring(0, 20), searchFilterText)}...</div>`;
                            }).join('') + `</div>`;
                    }
                }

                let finalBodyHtml, ytHtml = '';
                if (note.richText) {
                    finalBodyHtml = boldFirstLineRich(sanitizeRichHtml(note.content));
                } else {
                    const highlightedContent = highlightText(note.content, searchFilterText);
                    const linkResult = processContentLinks(highlightedContent);
                    finalBodyHtml = parseTodoListHtml(linkResult.html, note.id);
                    ytHtml = linkResult.ytHtml;
                }

                const pinClass = note.isPinned ? 'pin-item pinned' : 'pin-item';
                
                // 分享模式下不顯示原本的置頂與刪除按鈕
                const pinButtonHtml = shareId ? '' : `<button class="${pinClass}" onclick="event.stopPropagation(); togglePinNote('${note.id}', ${!note.isPinned})"></button>`;
                const deleteButtonHtml = shareId ? '' : `<button class="delete-item" onclick="event.stopPropagation(); deleteNote('${note.id}')">−</button>`;

                const todoCounts = countTodoItems(note.content);
                const showBatchBtn = todoCounts.total >= 3;
                const batchBtnHtml = showBatchBtn ? `<button class="batch-todo-btn" onclick="event.stopPropagation(); toggleAllTodoItems('${note.id}')" title="全選 / 全取消">⋮✓</button>` : '';

                div.innerHTML = `
                    ${deleteButtonHtml}
                    ${pinButtonHtml}
                    ${catHtml}
                    <div class="note-text collapsed" id="text-${note.id}">${finalBodyHtml}</div>
                    ${ytHtml}
                    <div class="toggle-text-btn" id="toggle-btn-${note.id}" onclick="event.stopPropagation(); toggleText('${note.id}')">🔽</div>
                    <div class="tag-list">${tagsHtml}</div>
                    <div class="image-gallery">${imgsHtml}</div>
                    ${relatedHtml}
                    <div class="note-footer">
                        <button class="share-note-btn" onclick="event.stopPropagation(); shareNoteLink('${note.id}')">分享 🔗</button>
                        ${batchBtnHtml}
                        <div class="note-time">${note.time}</div>
                    </div>
                `;
                container.appendChild(div);

                checkTextHeight(note.id);
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (!shareId && filteredNotes.length > totalVisibleCount) {
                loadMoreBtn.style.display = 'inline-block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        function scrollToNote(id) {
            // 清除篩選，確保目標筆記一定在列表中
            activeCategoryFilter = '';
            document.getElementById('searchCategoryFilter').value = '';
            document.getElementById('searchInput').value = '';

            // 從第 1 頁重新渲染
            currentPage = 1;
            executeFilter();

            // 用「實際顯示的清單」(filteredNotes) 來找位置
            const targetIndex = filteredNotes.findIndex(n => n.id === id);

            if (targetIndex === -1) {
                // 目標是秘書提醒類筆記：展開秘書區並捲動過去
                const target = notes.find(n => n.id === id);
                if (target && isReminderNote(target)) {
                    secretaryHidden = false;

                    secretaryExpanded = true;
                    renderSecretaryList();
                    const sec = document.getElementById('secretarySection');
                    if (sec) sec.scrollIntoView({ behavior: 'auto', block: 'start' });
                }
                return;
            }

            // 逐頁補渲染，直到目標所在的那一頁
            const requiredPage = Math.ceil((targetIndex + 1) / PAGE_SIZE);
            while (currentPage < requiredPage) {
                currentPage++;
                renderNotesList();
            }

            const el = document.getElementById(`note-${id}`);
            if (el) {
                el.scrollIntoView({ behavior: 'auto' });
                el.style.boxShadow = "0 0 15px rgba(0,122,255,0.5)";
                setTimeout(() => el.style.boxShadow = "0 2px 5px var(--shadow-color)", 1500);
            }
        }

            let matches = (type === 'content') ? allHistoryTags.filter(tag => content.includes(tag) && !kwInput.value.includes(tag)) : [];

            });

        function switchViewerImg(dir, event) {
            if (event) event.stopPropagation();
            viewerIndex += dir;
            if (viewerIndex < 0) viewerIndex = viewerImages.length - 1;
            if (viewerIndex >= viewerImages.length) viewerIndex = 0;
            
            imgScale = 1;
            const viewerImg = document.getElementById('viewer-img');

        function bindViewerGestures() {
            const viewer = document.getElementById('viewer');
            const viewerImg = document.getElementById('viewer-img');

            viewer.addEventListener('wheel', (e) => {
                e.preventDefault();
                if (e.deltaY < 0) {
                    imgScale = Math.min(imgScale + 0.1, 4);
                } else {
                    imgScale = Math.max(imgScale - 0.1, 0.5);
                }
                viewerImg.style.transform = `scale(${imgScale})`;
            }, { passive: false });

            let initialDist = 0;
            viewer.addEventListener('touchstart', (e) => {
                if (e.touches.length === 2) {
                    isPinched = true;
                    initialDist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                } else if (e.touches.length === 1) {
                    isPinched = false;
                    startX = e.touches[0].pageX;
                    startY = e.touches[0].pageY;
                }
            });

            viewer.addEventListener('touchmove', (e) => {
                if (e.touches.length === 2 && isPinched) {
                    e.preventDefault();
                    const dist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    const factor = dist / initialDist;
                    imgScale = Math.max(0.5, Math.min(imgScale * factor, 4));
                    viewerImg.style.transform = `scale(${imgScale})`;
                    initialDist = dist;
                }
            }, { passive: false });

            viewer.addEventListener('touchend', (e) => {
                if (e.touches.length === 0 && !isPinched) {
                    const endX = e.changedTouches[0].pageX;
                    const diffX = endX - startX;
                    if (imgScale <= 1.1 && Math.abs(diffX) > 60) {
                        if (diffX > 0) switchViewerImg(-1); 
                        else switchViewerImg(1); 
                    }
                }
            });
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; editingId = null; }
        
        function exportJSON() {
            const now = new Date();
            const dateStr = now.getFullYear().toString() + 
                            (now.getMonth() + 1).toString().padStart(2, '0') + 
                            now.getDate().toString().padStart(2, '0');
            
            let lastDate = localStorage.getItem('last_export_date');
            let sequence = parseInt(localStorage.getItem('export_sequence') || '0');
            
            if (lastDate !== dateStr) {
                sequence = 1;
            } else {
                sequence += 1;
            }
            
            localStorage.setItem('last_export_date', dateStr);
            localStorage.setItem('export_sequence', sequence.toString());
            
            const fileName = `mynote_${dateStr}_${sequence.toString().padStart(2, '0')}.json`;
            
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(notes, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", fileName);
            dl.click();
        }

        function importJSON(e) {
            const reader = new FileReader();
            reader.onload = ev => { 
                try { 
                    const data = JSON.parse(ev.target.result); 
                    data.forEach(n => db.child(n.id).set(n)); 
                    alert('讀取成功'); 
                } catch(err) { 
                    alert('讀取失敗，請確認檔案格式'); 
                } 
            };
            reader.readAsText(e.target.files[0]);
        }
    </script>
</body>
