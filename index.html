        // ===== 手寫畫圖（新增視窗專用）=====
        // 每一筆線條／圖形都以「物件」保存（不是直接畫成點陣圖），所以畫完之後仍可用「選取」工具
        // 重新編輯：移動、拉大縮小、改線條顏色、改填滿顏色、改粗細，並且可以復原。
        let inputDrawMode = false;
        let drawTool = 'pen';
        let drawing = false;
        let drawStartPt = null;
        let drawNeedsInit = true;
        let drawSavedRange = null;   // 切換到手寫前，文字游標所在位置（圖片會插入到這裡）

        let drawObjects = [];        // 已畫好的物件（由下往上疊）
        let drawCurrent = null;      // 正在畫、尚未放開的物件
        let drawSelected = null;     // 目前選取中的物件
        let drawGesture = null;      // 選取模式下的拖移／縮放動作
        let drawBefore = null;       // 每次動作開始前的快照（用於復原）
        let drawUndoStack = [];
        let drawFillLinked = true;   // 填滿顏色是否跟著線條顏色走（預設跟著，與舊版一樣）
        let drawStyleEdit = { obj: null, time: 0 };

        function drawClone(o) { return JSON.parse(JSON.stringify(o)); }
        function drawSnapshot() { return JSON.stringify(drawObjects); }
        function drawPushUndoState(snap) {
            drawUndoStack.push(snap);
            if (drawUndoStack.length > 40) drawUndoStack.shift();
        }
        function drawIsClosedShape(o) { return !!o && o.type !== 'pen' && o.type !== 'eraser' && o.type !== 'line'; }

        // 旋轉：封閉圖形以 rot（弧度）記錄旋轉角度，繞著自己的中心轉；手繪線則直接轉動各個點
        function drawCenter(o) { const b = drawBBox(o); return { x: (b.x1 + b.x2) / 2, y: (b.y1 + b.y2) / 2 }; }
        function drawRotPt(p, c, ang) {
            const cos = Math.cos(ang), sin = Math.sin(ang), dx = p.x - c.x, dy = p.y - c.y;
            return { x: c.x + dx * cos - dy * sin, y: c.y + dx * sin + dy * cos };
        }
        function drawToLocal(o, p) { return (drawIsClosedShape(o) && o.rot) ? drawRotPt(p, drawCenter(o), -o.rot) : p; }
        function drawFromLocal(o, p) { return (drawIsClosedShape(o) && o.rot) ? drawRotPt(p, drawCenter(o), o.rot) : p; }
        function drawNormAngle(a) { return ((a + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI; }

        function resetDrawState() {
            exitDrawMode();
            drawObjects = [];
            drawCurrent = null;
            drawSelected = null;
            drawGesture = null;
            drawUndoStack = [];
            drawNeedsInit = true;
            drawSavedRange = null;
            drawing = false;
            drawFillLinked = true;
            const btn = document.getElementById('drawInsertBtn');
            if (btn) { btn.disabled = false; btn.innerText = '＋ 插入圖片到內容'; }
        }

        function toggleDrawMode() {
            if (inputDrawMode) exitDrawMode(); else enterDrawMode();
        }

        function enterDrawMode() {
            if (inputDrawMode) return;
            const el = document.getElementById('noteContent');
            const sel = window.getSelection();
            drawSavedRange = null;
            if (sel.rangeCount > 0 && el.contains(sel.getRangeAt(0).startContainer)) {
                const r = sel.getRangeAt(0).cloneRange();
                r.collapse(false);
                drawSavedRange = r;
            }
            inputDrawMode = true;
            const toolbarBox = document.querySelector('#inputModal .reminder-row-scroll');
            if (toolbarBox) toolbarBox.style.display = 'none';
            el.style.display = 'none';
            document.getElementById('drawPanel').style.display = 'flex';
            renderDrawRecentColors();
            document.getElementById('inputRichToolbar').classList.add('draw-mode');
            document.getElementById('drawToggleBtn').innerText = '⌨️';
            if (drawNeedsInit || drawObjects.length === 0) setupDrawCanvas(); else drawRedraw();
        }

        function exitDrawMode() {
            const el = document.getElementById('noteContent');
            if (el) el.style.display = '';
            const panel = document.getElementById('drawPanel');
            if (panel) panel.style.display = 'none';
            const tb = document.getElementById('inputRichToolbar');
            if (tb) tb.classList.remove('draw-mode');
            const toolbarBox = document.querySelector('#inputModal .reminder-row-scroll');
            if (toolbarBox) toolbarBox.style.display = '';
            const tgl = document.getElementById('drawToggleBtn');
            if (tgl) tgl.innerText = '🎨';
            closeDrawShapeMenu();
            inputDrawMode = false;
        }

        function setupDrawCanvas() {
            const c = document.getElementById('drawCanvas');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const w = Math.max(200, Math.floor(c.clientWidth));
            const h = Math.max(100, Math.floor(c.clientHeight));
            c.width = Math.floor(w * dpr);
            c.height = Math.floor(h * dpr);
            drawObjects = [];
            drawCurrent = null;
            drawSelected = null;
            drawGesture = null;
            drawUndoStack = [];
            drawNeedsInit = false;
            drawRedraw();
        }

        function drawScale() {
            const c = document.getElementById('drawCanvas');
            const r = c.getBoundingClientRect();
            return r.width > 0 ? c.width / r.width : 1;
        }

        const DRAW_SHAPES = { rect: '▭', circle: '◯', triangle: '△', pentagon: '⬠', hexagon: '⬡' };
        let drawProportional = false;   // 手機用的「等比例」開關（電腦版可直接按住 Shift）

        function setDrawTool(tool) {
            drawTool = tool;
            document.querySelectorAll('#drawPanel .draw-tool-btn[data-tool]').forEach(b => {
                b.classList.toggle('active', b.dataset.tool === tool);
            });
            const isShape = !!DRAW_SHAPES[tool];
            const shapeBtn = document.getElementById('drawShapeBtn');
            if (shapeBtn) {
                shapeBtn.classList.toggle('active', isShape);
                if (isShape) shapeBtn.innerText = DRAW_SHAPES[tool] + '▾';
            }
            document.querySelectorAll('#drawShapeMenu .draw-tool-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.shape === tool);
            });
            closeDrawShapeMenu();
            document.getElementById('drawCanvas').style.cursor = (tool === 'select') ? 'default' : 'crosshair';
            if (tool !== 'select' && drawSelected) { drawSelected = null; drawGesture = null; drawRedraw(); }
        }

        function toggleDrawShapeMenu() {
            document.getElementById('drawShapeMenu').classList.toggle('open');
        }
        function closeDrawShapeMenu() {
            const m = document.getElementById('drawShapeMenu');
            if (m) m.classList.remove('open');
        }
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.draw-shape-wrap')) closeDrawShapeMenu();
        });

        function toggleDrawProportional() {
            drawProportional = !drawProportional;
            document.getElementById('drawLockBtn').classList.toggle('active', drawProportional);
        }

        // 等比例：圖形變成正方形範圍（圓→正圓、五／六角形→正多邊形）；直線則吸附到 45° 倍數
        function drawConstrainPoint(a, p, tool) {
            const dx = p.x - a.x, dy = p.y - a.y;
            if (tool === 'line') {
                const step = Math.PI / 4;
                const snap = Math.round(Math.atan2(dy, dx) / step) * step;
                const len = Math.hypot(dx, dy);
                return { x: a.x + len * Math.cos(snap), y: a.y + len * Math.sin(snap) };
            }
            const s = Math.max(Math.abs(dx), Math.abs(dy));
            return { x: a.x + (dx < 0 ? -s : s), y: a.y + (dy < 0 ? -s : s) };
        }

        // 最近使用的繪圖顏色（最多保留 12 組）
        function getDrawRecentColors() {
            try { return JSON.parse(localStorage.getItem('drawRecentColors') || '[]'); } catch (e) { return []; }
        }
        function addDrawRecentColor(hex) {
            if (!hex) return;
            const recent = getDrawRecentColors();
            if (!recent.some(c => c.toLowerCase() === hex.toLowerCase())) {
                recent.unshift(hex);
                try { localStorage.setItem('drawRecentColors', JSON.stringify(recent.slice(0, 12))); } catch (e) {}
            }
            renderDrawRecentColors();
        }
        function renderDrawRecentColors() {
            const row = document.getElementById('drawRecentColors');
            if (!row) return;
            const recent = getDrawRecentColors();
            const current = (document.getElementById('drawColor').value || '').toLowerCase();
            row.innerHTML = '';
            if (recent.length === 0) return;
            const label = document.createElement('span');
            label.className = 'draw-recent-label';
            label.innerText = '最近';
            row.appendChild(label);
            recent.forEach(c => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'draw-recent-swatch' + (c.toLowerCase() === current ? ' current' : '');
                b.style.background = c;
                b.title = c;
                b.onclick = () => { document.getElementById('drawColor').value = c; renderDrawRecentColors(); onDrawStyleChange(); };
                row.appendChild(b);
            });
        }
        function onDrawColorChange() {
            addDrawRecentColor(document.getElementById('drawColor').value);
        }
        renderDrawRecentColors();
        drawSyncFillBtn();

        // ---------- 幾何計算（選取、點擊判斷、縮放用）----------
        function drawBBox(o) {
            if (o.type === 'pen' || o.type === 'eraser') {
                let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
                o.pts.forEach(q => {
                    if (q.x < x1) x1 = q.x;
                    if (q.y < y1) y1 = q.y;
                    if (q.x > x2) x2 = q.x;
                    if (q.y > y2) y2 = q.y;
                });
                return { x1, y1, x2, y2 };
            }
            return { x1: Math.min(o.a.x, o.b.x), y1: Math.min(o.a.y, o.b.y), x2: Math.max(o.a.x, o.b.x), y2: Math.max(o.a.y, o.b.y) };
        }

        function drawShapeVertices(o) {
            const b = drawBBox(o);
            const cx = (b.x1 + b.x2) / 2, cy = (b.y1 + b.y2) / 2, rx = (b.x2 - b.x1) / 2, ry = (b.y2 - b.y1) / 2;
            if (o.type === 'rect') return [{ x: b.x1, y: b.y1 }, { x: b.x2, y: b.y1 }, { x: b.x2, y: b.y2 }, { x: b.x1, y: b.y2 }];
            if (o.type === 'triangle') return [{ x: cx, y: b.y1 }, { x: b.x2, y: b.y2 }, { x: b.x1, y: b.y2 }];
            const n = o.type === 'pentagon' ? 5 : (o.type === 'hexagon' ? 6 : 48);
            const start = (o.type === 'circle') ? 0 : -Math.PI / 2;
            const pts = [];
            for (let k = 0; k < n; k++) {
                const ang = start + k * 2 * Math.PI / n;
                pts.push({ x: cx + rx * Math.cos(ang), y: cy + ry * Math.sin(ang) });
            }
            return pts;
        }

        // 含旋轉後的實際外框（輸出圖片裁切用）
        function drawWorldBBox(o) {
            if (drawIsClosedShape(o) && o.rot) {
                let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
                drawShapeVertices(o).forEach(q => {
                    const w = drawFromLocal(o, q);
                    if (w.x < x1) x1 = w.x;
                    if (w.y < y1) y1 = w.y;
                    if (w.x > x2) x2 = w.x;
                    if (w.y > y2) y2 = w.y;
                });
                return { x1, y1, x2, y2 };
            }
            return drawBBox(o);
        }

        function drawDistToSeg(p, a, b) {
            const dx = b.x - a.x, dy = b.y - a.y;
            const len2 = dx * dx + dy * dy;
            let t = len2 === 0 ? 0 : ((p.x - a.x) * dx + (p.y - a.y) * dy) / len2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
        }

        function drawPointInPolygon(p, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
                if (((yi > p.y) !== (yj > p.y)) && (p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi)) inside = !inside;
            }
            return inside;
        }

        // 點在線條上（含容許誤差）；已填滿的圖形，點到內部也算
        function drawHitTest(o, p, tol) {
            const half = o.width / 2 + tol;
            if (o.type === 'pen') {
                if (o.pts.length === 1) return Math.hypot(p.x - o.pts[0].x, p.y - o.pts[0].y) <= half;
                for (let i = 1; i < o.pts.length; i++) {
                    if (drawDistToSeg(p, o.pts[i - 1], o.pts[i]) <= half) return true;
                }
                return false;
            }
            if (o.type === 'line') return drawDistToSeg(p, o.a, o.b) <= half;
            const q = drawToLocal(o, p);   // 圖形可能被旋轉：先把點轉回圖形自己的座標系再比對
            const v = drawShapeVertices(o);
            for (let i = 0; i < v.length; i++) {
                if (drawDistToSeg(q, v[i], v[(i + 1) % v.length]) <= half) return true;
            }
            return !!o.fill && drawPointInPolygon(q, v);
        }

        function drawFindHit(p, s) {
            for (let i = drawObjects.length - 1; i >= 0; i--) {
                const o = drawObjects[i];
                if (o.type === 'eraser') continue;
                if (drawHitTest(o, p, 8 * s)) return o;
            }
            return null;
        }

        function drawGetHandles(o) {
            if (o.type === 'line') return [{ id: 'p0', x: o.a.x, y: o.a.y }, { id: 'p1', x: o.b.x, y: o.b.y }];
            const b = drawBBox(o);
            const mx = (b.x1 + b.x2) / 2, my = (b.y1 + b.y2) / 2;
            return [
                { id: 'nw', x: b.x1, y: b.y1 }, { id: 'ne', x: b.x2, y: b.y1 },
                { id: 'se', x: b.x2, y: b.y2 }, { id: 'sw', x: b.x1, y: b.y2 },
                { id: 'n', x: mx, y: b.y1 }, { id: 'e', x: b.x2, y: my },
                { id: 's', x: mx, y: b.y2 }, { id: 'w', x: b.x1, y: my }
            ];
        }

        // 旋轉鈕：在選取框「右上角」的外側（直線不需要，拖端點即可）
        function drawRotateHandle(o, s) {
            if (o.type === 'line' || o.type === 'eraser') return null;
            const b = drawBBox(o);
            const d = 24 * s / Math.SQRT2;
            return { id: 'rot', x: b.x2 + d, y: b.y1 - d };
        }

        // p 為畫布上的實際座標；s 為畫布縮放比例
        function drawHitHandle(o, p, s) {
            const q = drawToLocal(o, p);
            const rh = drawRotateHandle(o, s);
            if (rh && Math.hypot(q.x - rh.x, q.y - rh.y) <= 12 * s) return rh;
            const r = 14 * s;
            const hs = drawGetHandles(o);
            for (let i = 0; i < hs.length; i++) {
                if (Math.abs(q.x - hs[i].x) <= r && Math.abs(q.y - hs[i].y) <= r) return hs[i];
            }
            return null;
        }

        function drawTranslate(o, orig, dx, dy) {
            if (o.type === 'pen' || o.type === 'eraser') {
                o.pts = orig.pts.map(q => ({ x: q.x + dx, y: q.y + dy }));
            } else {
                o.a = { x: orig.a.x + dx, y: orig.a.y + dy };
                o.b = { x: orig.b.x + dx, y: orig.b.y + dy };
            }
        }

        // 拖拉控制點縮放；keepRatio（Shift 或「🔒 等比」）時，四個角維持原本的長寬比
        function drawResize(o, orig, id, p, keepRatio) {
            if (o.type === 'line') {
                if (id === 'p0') {
                    const q = keepRatio ? drawConstrainPoint(orig.b, p, 'line') : p;
                    o.a = { x: q.x, y: q.y };
                } else {
                    const q = keepRatio ? drawConstrainPoint(orig.a, p, 'line') : p;
                    o.b = { x: q.x, y: q.y };
                }
                return;
            }
            const ob = drawBBox(orig);
            const ow = ob.x2 - ob.x1, oh = ob.y2 - ob.y1;
            const rot = (drawIsClosedShape(orig) && orig.rot) ? orig.rot : 0;
            const c0 = drawCenter(orig);
            if (rot) p = drawRotPt(p, c0, -rot);   // 把指標轉進圖形自己的（未旋轉）座標系
            let x1 = ob.x1, y1 = ob.y1, x2 = ob.x2, y2 = ob.y2;
            if (keepRatio && id.length === 2 && ow > 0 && oh > 0) {
                const fx = id.indexOf('w') >= 0 ? ob.x2 : ob.x1;
                const fy = id.indexOf('n') >= 0 ? ob.y2 : ob.y1;
                const dx = p.x - fx, dy = p.y - fy;
                const k = Math.max(Math.abs(dx) / ow, Math.abs(dy) / oh);
                const nx = fx + (dx < 0 ? -1 : 1) * ow * k;
                const ny = fy + (dy < 0 ? -1 : 1) * oh * k;
                if (id.indexOf('w') >= 0) { x2 = fx; x1 = nx; } else { x1 = fx; x2 = nx; }
                if (id.indexOf('n') >= 0) { y2 = fy; y1 = ny; } else { y1 = fy; y2 = ny; }
            } else {
                if (id.indexOf('w') >= 0) x1 = p.x;
                if (id.indexOf('e') >= 0) x2 = p.x;
                if (id.indexOf('n') >= 0) y1 = p.y;
                if (id.indexOf('s') >= 0) y2 = p.y;
            }
            if (o.type === 'pen' || o.type === 'eraser') {
                o.pts = orig.pts.map(q => ({
                    x: ow > 0.5 ? x1 + (q.x - ob.x1) * ((x2 - x1) / ow) : q.x,
                    y: oh > 0.5 ? y1 + (q.y - ob.y1) * ((y2 - y1) / oh) : q.y
                }));
            } else {
                // 新外框的中心要換算回實際座標；旋轉過的圖形，被拖的那一邊對邊會留在原地
                const m = { x: (x1 + x2) / 2, y: (y1 + y2) / 2 };
                const c1 = rot ? drawRotPt(m, c0, rot) : m;
                const w = Math.abs(x2 - x1), h = Math.abs(y2 - y1);
                o.a = { x: c1.x - w / 2, y: c1.y - h / 2 };
                o.b = { x: c1.x + w / 2, y: c1.y + h / 2 };
            }
        }

        // 拖旋轉鈕：封閉圖形改 rot；手繪線轉動各點。Shift 或「🔒」時，每 15° 吸附一次
        function drawRotateObject(o, orig, c, startAngle, p, snap) {
            let delta = Math.atan2(p.y - c.y, p.x - c.x) - startAngle;
            const step = Math.PI / 12;
            if (drawIsClosedShape(o)) {
                let rot = (orig.rot || 0) + delta;
                if (snap) rot = Math.round(rot / step) * step;
                o.rot = drawNormAngle(rot);
            } else {
                if (snap) delta = Math.round(delta / step) * step;
                o.pts = orig.pts.map(q => drawRotPt(q, c, delta));
            }
        }

        // ---------- 繪製 ----------
        function drawShapePath(ctx, tool, a, b) {
            const x1 = Math.min(a.x, b.x), y1 = Math.min(a.y, b.y), x2 = Math.max(a.x, b.x), y2 = Math.max(a.y, b.y);
            ctx.beginPath();
            if (tool === 'rect') {
                ctx.rect(x1, y1, x2 - x1, y2 - y1);
            } else if (tool === 'circle') {
                ctx.ellipse((x1 + x2) / 2, (y1 + y2) / 2, (x2 - x1) / 2, (y2 - y1) / 2, 0, 0, Math.PI * 2);
            } else if (tool === 'triangle') {
                ctx.moveTo((x1 + x2) / 2, y1);
                ctx.lineTo(x2, y2);
                ctx.lineTo(x1, y2);
                ctx.closePath();
            } else if (tool === 'pentagon' || tool === 'hexagon') {
                const n = tool === 'pentagon' ? 5 : 6;
                const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, rx = (x2 - x1) / 2, ry = (y2 - y1) / 2;
                for (let k = 0; k < n; k++) {
                    const ang = -Math.PI / 2 + k * 2 * Math.PI / n;
                    const px = cx + rx * Math.cos(ang), py = cy + ry * Math.sin(ang);
                    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
            }
        }

        // 把一個物件畫到 ctx 上（ox, oy 為位移，匯出裁切圖片時使用）
        function drawRenderObject(ctx, o, ox, oy) {
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = o.width;
            if (o.type === 'pen' || o.type === 'eraser') {
                ctx.strokeStyle = (o.type === 'eraser') ? '#ffffff' : o.color;
                ctx.beginPath();
                ctx.moveTo(o.pts[0].x - ox, o.pts[0].y - oy);
                if (o.pts.length === 1) {
                    ctx.lineTo(o.pts[0].x - ox + 0.01, o.pts[0].y - oy + 0.01);
                } else {
                    for (let i = 1; i < o.pts.length; i++) ctx.lineTo(o.pts[i].x - ox, o.pts[i].y - oy);
                }
                ctx.stroke();
                return;
            }
            const a = { x: o.a.x - ox, y: o.a.y - oy }, b = { x: o.b.x - ox, y: o.b.y - oy };
            ctx.strokeStyle = o.color;
            if (o.type === 'line') {
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);
                ctx.stroke();
                return;
            }
            ctx.save();
            if (o.rot) {
                const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
                ctx.translate(cx, cy);
                ctx.rotate(o.rot);
                ctx.translate(-cx, -cy);
            }
            drawShapePath(ctx, o.type, a, b);
            if (o.fill) { ctx.fillStyle = o.fillColor || o.color; ctx.fill(); }
            ctx.stroke();
            ctx.restore();
        }

        // 選取框與控制點（只畫在畫布上，不會被匯出到圖片）
        function drawRenderSelection(ctx, o) {
            const s = drawScale();
            ctx.save();
            ctx.lineWidth = 1.5 * s;
            ctx.strokeStyle = '#007AFF';
            if (drawIsClosedShape(o) && o.rot) {
                const c = drawCenter(o);
                ctx.translate(c.x, c.y);
                ctx.rotate(o.rot);
                ctx.translate(-c.x, -c.y);
            }
            if (o.type !== 'line') {
                const b = drawBBox(o);
                ctx.setLineDash([6 * s, 4 * s]);
                ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
                ctx.setLineDash([]);
            }
            const hs = 5 * s;
            drawGetHandles(o).forEach(h => {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.rect(h.x - hs, h.y - hs, hs * 2, hs * 2);
                ctx.fill();
                ctx.stroke();
            });
            const rh = drawRotateHandle(o, s);
            if (rh) {
                const b = drawBBox(o);
                // 旋轉鈕與右上角之間的連接線
                ctx.beginPath();
                ctx.moveTo(b.x2, b.y1);
                ctx.lineTo(rh.x, rh.y);
                ctx.stroke();
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(rh.x, rh.y, 9 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                // 圓形箭頭圖樣 ↻
                const ang = 1.8 * Math.PI, r = 4.5 * s;
                ctx.beginPath();
                ctx.arc(rh.x, rh.y, r, 0.3 * Math.PI, ang);
                ctx.stroke();
                const ex = rh.x + r * Math.cos(ang), ey = rh.y + r * Math.sin(ang);
                const tx = -Math.sin(ang), ty = Math.cos(ang), nx = Math.cos(ang), ny = Math.sin(ang);
                ctx.beginPath();
                ctx.moveTo(ex + tx * 3.5 * s, ey + ty * 3.5 * s);
                ctx.lineTo(ex + nx * 2.5 * s, ey + ny * 2.5 * s);
                ctx.lineTo(ex - nx * 2.5 * s, ey - ny * 2.5 * s);
                ctx.closePath();
                ctx.fillStyle = '#007AFF';
                ctx.fill();
            }
            ctx.restore();
        }

        function drawRedraw() {
            const c = document.getElementById('drawCanvas');
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, c.width, c.height);
            drawObjects.forEach(o => drawRenderObject(ctx, o, 0, 0));
            if (drawCurrent) drawRenderObject(ctx, drawCurrent, 0, 0);
            if (drawSelected && drawTool === 'select') drawRenderSelection(ctx, drawSelected);
        }

        // 裁掉四周空白，只留下實際畫到的範圍（外加一點邊距）；由向量物件重新繪製，不含選取框
        function drawExportCanvas() {
            const c = document.getElementById('drawCanvas');
            const s = drawScale();
            let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
            drawObjects.forEach(o => {
                if (o.type === 'eraser') return;
                const b = drawWorldBBox(o), h = o.width / 2;
                x1 = Math.min(x1, b.x1 - h); y1 = Math.min(y1, b.y1 - h);
                x2 = Math.max(x2, b.x2 + h); y2 = Math.max(y2, b.y2 + h);
            });
            const pad = 8 * s;
            x1 = Math.max(0, Math.floor(x1 - pad)); y1 = Math.max(0, Math.floor(y1 - pad));
            x2 = Math.min(c.width, Math.ceil(x2 + pad)); y2 = Math.min(c.height, Math.ceil(y2 + pad));
            if (!(x2 > x1 && y2 > y1)) { x1 = 0; y1 = 0; x2 = c.width; y2 = c.height; }
            const cw = x2 - x1, ch = y2 - y1;
            const out = document.createElement('canvas');
            out.width = cw;
            out.height = ch;
            const octx = out.getContext('2d');
            octx.fillStyle = '#ffffff';
            octx.fillRect(0, 0, cw, ch);
            drawObjects.forEach(o => drawRenderObject(octx, o, x1, y1));
            return { canvas: out, cssWidth: Math.round(cw / s) };
        }

        // ---------- 復原／刪除／清除 ----------
        function drawUndo() {
            if (drawUndoStack.length === 0) return;
            drawObjects = JSON.parse(drawUndoStack.pop());
            drawSelected = null;
            drawGesture = null;
            drawRedraw();
        }

        function drawDeleteSelected() {
            if (!drawSelected) return;
            drawPushUndoState(drawSnapshot());
            drawObjects = drawObjects.filter(o => o !== drawSelected);
            drawSelected = null;
            drawGesture = null;
            drawRedraw();
        }

        function drawClear() {
            if (drawObjects.length === 0) return;
            drawPushUndoState(drawSnapshot());
            drawObjects = [];
            drawSelected = null;
            drawGesture = null;
            drawRedraw();
        }

        // ---------- 顏色／粗細／填滿：套用到「選取中」的圖形 ----------
        function drawLoadControlsFromObject(o) {
            const s = drawScale();
            document.getElementById('drawColor').value = o.color || '#000000';
            const w = Math.max(1, Math.min(30, Math.round(o.width / s)));
            document.getElementById('drawWidth').value = w;
            document.getElementById('drawWidthLabel').innerText = String(w);
            if (drawIsClosedShape(o)) {
                document.getElementById('drawFill').checked = !!o.fill;
                document.getElementById('drawFillColor').value = o.fillColor || o.color || '#000000';
            }
            drawSyncFillBtn();
            renderDrawRecentColors();
        }

        function drawApplyStyleToSelected() {
            const o = drawSelected;
            if (!o) return;
            const before = drawSnapshot();
            const s = drawScale();
            o.color = document.getElementById('drawColor').value;
            o.width = (parseInt(document.getElementById('drawWidth').value, 10) || 4) * s;
            if (drawIsClosedShape(o)) {
                o.fill = document.getElementById('drawFill').checked;
                o.fillColor = document.getElementById('drawFillColor').value;
            }
            if (drawSnapshot() === before) return;
            const now = Date.now();
            // 連續拖動顏色／粗細時，合併成同一次「復原」
            if (drawStyleEdit.obj !== o || now - drawStyleEdit.time > 800) drawPushUndoState(before);
            drawStyleEdit = { obj: o, time: now };
            drawRedraw();
        }

        // 「填滿」按鈕（油漆桶圖樣）：按下去＝開啟填滿；圖樣下方的色條顯示目前的填滿顏色
        function drawSyncFillBtn() {
            const btn = document.getElementById('drawFillBtn');
            if (!btn) return;
            btn.classList.toggle('active', document.getElementById('drawFill').checked);
            const bar = document.getElementById('drawFillBar');
            if (bar) bar.setAttribute('fill', document.getElementById('drawFillColor').value);
        }

        function toggleDrawFill() {
            const cb = document.getElementById('drawFill');
            cb.checked = !cb.checked;
            onDrawStyleChange();
        }

        function onDrawStyleChange() {
            if (!drawSelected && drawFillLinked) {
                document.getElementById('drawFillColor').value = document.getElementById('drawColor').value;
            }
            drawSyncFillBtn();
            if (drawSelected && drawTool === 'select') drawApplyStyleToSelected();
        }

        function onDrawFillColorInput() {
            drawFillLinked = false;
            if (drawSelected && drawTool === 'select') {
                if (drawIsClosedShape(drawSelected)) document.getElementById('drawFill').checked = true;
            }
            drawSyncFillBtn();
            if (drawSelected && drawTool === 'select') drawApplyStyleToSelected();
        }

        function onDrawWidthInput(v) {
            document.getElementById('drawWidthLabel').innerText = v;
            if (drawSelected && drawTool === 'select') drawApplyStyleToSelected();
        }

        // ---------- 畫布操作 ----------
        function drawGetPoint(e) {
            const c = document.getElementById('drawCanvas');
            const r = c.getBoundingClientRect();
            return {
                x: (e.clientX - r.left) * (c.width / r.width),
                y: (e.clientY - r.top) * (c.height / r.height)
            };
        }

        function drawSelectDown(p, s) {
            drawGesture = null;
            if (drawSelected) {
                const h = drawHitHandle(drawSelected, p, s);
                if (h && h.id === 'rot') {
                    const c0 = drawCenter(drawSelected);
                    drawGesture = { mode: 'rotate', orig: drawClone(drawSelected), center: c0,
                                    startAngle: Math.atan2(p.y - c0.y, p.x - c0.x), start: p };
                    drawRedraw();
                    return;
                }
                if (h) {
                    drawGesture = { mode: 'resize', handle: h.id, orig: drawClone(drawSelected), start: p };
                    drawRedraw();
                    return;
                }
            }
            let hit = drawFindHit(p, s);
            // 已選取的「未填滿」圖形：點它的內部空白處也能拖移
            if (!hit && drawSelected && drawSelected.type !== 'line') {
                const b = drawBBox(drawSelected);
                const q = drawToLocal(drawSelected, p);
                if (q.x >= b.x1 && q.x <= b.x2 && q.y >= b.y1 && q.y <= b.y2) hit = drawSelected;
            }
            if (hit) {
                drawSelected = hit;
                drawLoadControlsFromObject(hit);
                drawGesture = { mode: 'move', orig: drawClone(hit), start: p };
            } else {
                drawSelected = null;
            }
            drawRedraw();
        }

        function drawUpdateHoverCursor(p) {
            const c = document.getElementById('drawCanvas');
            const s = drawScale();
            let cur = 'default';
            if (drawSelected) {
                const h = drawHitHandle(drawSelected, p, s);
                if (h && h.id === 'rot') {
                    cur = 'grab';
                } else if (h) {
                    cur = ({ nw: 'nwse-resize', se: 'nwse-resize', ne: 'nesw-resize', sw: 'nesw-resize',
                             n: 'ns-resize', s: 'ns-resize', e: 'ew-resize', w: 'ew-resize', p0: 'crosshair', p1: 'crosshair' })[h.id] || 'default';
                }
            }
            if (cur === 'default' && drawFindHit(p, s)) cur = 'move';
            c.style.cursor = cur;
        }

        function drawPointerDown(e) {
            if (e.pointerType === 'mouse' && e.button !== 0) return;
            e.preventDefault();
            const c = document.getElementById('drawCanvas');
            try { c.setPointerCapture(e.pointerId); } catch (err) {}
            closeDrawShapeMenu();
            const p = drawGetPoint(e);
            const s = drawScale();
            drawBefore = drawSnapshot();
            drawStartPt = p;

            if (drawTool === 'select') { drawSelectDown(p, s); return; }

            const color = document.getElementById('drawColor').value;
            const width = (parseInt(document.getElementById('drawWidth').value, 10) || 4) * s;
            drawing = true;
            if (drawTool === 'pen' || drawTool === 'eraser') {
                drawCurrent = { type: drawTool, pts: [p], color: color, width: (drawTool === 'eraser') ? width * 2 : width };
                drawRenderObject(c.getContext('2d'), drawCurrent, 0, 0);
                if (drawTool === 'pen') addDrawRecentColor(color);
            } else if (drawTool === 'line') {
                drawCurrent = { type: 'line', a: p, b: p, color: color, width: width };
                addDrawRecentColor(color);
            } else {
                const fillColor = document.getElementById('drawFillColor').value;
                drawCurrent = { type: drawTool, a: p, b: p, color: color, width: width,
                                fill: document.getElementById('drawFill').checked, fillColor: fillColor };
                addDrawRecentColor(color);
            }
        }

        function drawPointerMove(e) {
            const p = drawGetPoint(e);
            if (drawGesture) {
                e.preventDefault();
                const o = drawSelected;
                if (!o) return;
                if (drawGesture.mode === 'move') {
                    drawTranslate(o, drawGesture.orig, p.x - drawGesture.start.x, p.y - drawGesture.start.y);
                } else if (drawGesture.mode === 'rotate') {
                    drawRotateObject(o, drawGesture.orig, drawGesture.center, drawGesture.startAngle, p, e.shiftKey || drawProportional);
                } else {
                    drawResize(o, drawGesture.orig, drawGesture.handle, p, e.shiftKey || drawProportional);
                }
                drawRedraw();
                return;
            }
            if (!drawing) {
                if (drawTool === 'select') drawUpdateHoverCursor(p);
                return;
            }
            e.preventDefault();
            if (drawCurrent.type === 'pen' || drawCurrent.type === 'eraser') {
                const ctx = document.getElementById('drawCanvas').getContext('2d');
                const last = drawCurrent.pts[drawCurrent.pts.length - 1];
                drawCurrent.pts.push(p);
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = drawCurrent.width;
                ctx.strokeStyle = (drawCurrent.type === 'eraser') ? '#ffffff' : drawCurrent.color;
                ctx.beginPath();
                ctx.moveTo(last.x, last.y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            } else {
                let q = p;
                if (e.shiftKey || drawProportional) q = drawConstrainPoint(drawStartPt, p, drawCurrent.type);
                drawCurrent.b = q;
                drawRedraw();
            }
        }

        function drawPointerUp(e) {
            try { document.getElementById('drawCanvas').releasePointerCapture(e.pointerId); } catch (err) {}
            if (drawGesture) {
                drawGesture = null;
                if (drawSnapshot() !== drawBefore) drawPushUndoState(drawBefore);
                drawRedraw();
                return;
            }
            if (!drawing) return;
            drawing = false;
            const o = drawCurrent;
            drawCurrent = null;
            if (o) {
                const s = drawScale();
                let keep = true;
                if (o.type === 'line') {
                    keep = Math.hypot(o.b.x - o.a.x, o.b.y - o.a.y) >= 3 * s;
                } else if (o.type !== 'pen' && o.type !== 'eraser') {
                    keep = Math.abs(o.b.x - o.a.x) >= 3 * s && Math.abs(o.b.y - o.a.y) >= 3 * s;
                    if (keep) {
                        const b = drawBBox(o);
                        o.a = { x: b.x1, y: b.y1 };
                        o.b = { x: b.x2, y: b.y2 };
                    }
                }
                if (keep) {
                    drawObjects.push(o);
                    drawPushUndoState(drawBefore);
                }
            }
            drawRedraw();
        }

        (function initDrawCanvasEvents() {
            const c = document.getElementById('drawCanvas');
            c.addEventListener('pointerdown', drawPointerDown);
            c.addEventListener('pointermove', drawPointerMove);
            c.addEventListener('pointerup', drawPointerUp);
            c.addEventListener('pointercancel', drawPointerUp);
        })();

        // 電腦版：選取圖形後按 Delete 鍵可刪除
        document.addEventListener('keydown', function(e) {
            if (!inputDrawMode || !drawSelected || e.key !== 'Delete') return;
            const tag = document.activeElement ? document.activeElement.tagName : '';
            if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
            e.preventDefault();
            drawDeleteSelected();
        });

        // 把畫好的圖上傳到 Cloudinary，再插入到文字內容中原本游標的位置
        function insertDrawingToContent() {
            if (!drawObjects.some(o => o.type !== 'eraser')) { alert('請先畫點東西'); return; }
            const btn = document.getElementById('drawInsertBtn');
            btn.disabled = true;
            btn.innerText = '⏳ 上傳中...';
            const cropped = drawExportCanvas();
            const cssW = cropped.cssWidth;
            cropped.canvas.toBlob(async function(blob) {
                if (!blob) {
                    btn.disabled = false;
                    btn.innerText = '＋ 插入圖片到內容';
                    alert('圖片產生失敗');
                    return;
                }
                const cloudName = 'keloftva';
                const uploadPreset = 'ml_default';
                // 每次都用「不重複」的檔名與 public_id，避免 Cloudinary 認為是同一張圖而一直回傳第一次上傳的舊圖
                const uniqueId = 'drawing_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
                const formData = new FormData();
                formData.append('file', blob, uniqueId + '.png');
                formData.append('upload_preset', uploadPreset);
                formData.append('public_id', uniqueId);
                try {
                    const response = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
                        method: 'POST',
                        body: formData
                    });
                    const result = await response.json();
                    if (result.secure_url) {
                        exitDrawMode();
                        insertDrawingImage(result.secure_url, cssW);
                        drawSavedRange = null;
                        drawNeedsInit = true;   // 下次進入手寫會是全新的空白畫布
                        drawObjects = [];
                        drawSelected = null;
                        drawUndoStack = [];
                    } else {
                        alert('上傳失敗：' + (result.error ? result.error.message : '未知錯誤'));
                    }
                } catch (err) {
                    alert('上傳發生錯誤：' + err.message);
                } finally {
                    btn.disabled = false;
                    btn.innerText = '＋ 插入圖片到內容';
                }
            }, 'image/png');
        }

        function insertDrawingImage(url, cssWidth) {
            const el = document.getElementById('noteContent');
            el.focus();
            const sel = window.getSelection();
            sel.removeAllRanges();
            let range;
            if (drawSavedRange && el.contains(drawSavedRange.startContainer)) {
                range = drawSavedRange;
            } else {
                range = document.createRange();
                range.selectNodeContents(el);
                range.collapse(false);
            }
            sel.addRange(range);
            range = sel.getRangeAt(0);
            range.deleteContents();
            const img = document.createElement('img');
            img.src = url;
            img.setAttribute('data-draw', '1');
            img.className = 'note-img inline-note-img inline-draw-img';
            if (cssWidth > 0) {
                img.setAttribute('data-w', String(cssWidth));
                img.style.width = cssWidth + 'px';
            }
            range.insertNode(img);
            range.setStartAfter(img);
            range.collapse(true);
            sel.removeAllRanges();
            sel.addRange(range);
        }

        // ===== Phase 2：文字顏色／背景色／清除格式 =====
        let savedRange = null;
        let colorPanelMode = null;      // 'color' 或 'backgroundColor'
        let colorPanelTargetId = null;

        // ===== 連續套用格式（反選文字後可連續點選工具列而不失效）=====
        let formatSelectionOffsets = {}; // { targetId: {start, end} }，記錄「最後一次有效的反選範圍」

        // 走訪 contenteditable 內容，將 <br> 視為換行符 '\n'，回傳從頭到指定節點/位置為止的文字
        // （與 Phase 3 的 getTextWithBreaks 共用同一份定義，見下方）

        // 取得目前選取範圍相對於容器的字元位移（起、迄）
        function getSelectionOffsets(el) {
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return null;
            const range = sel.getRangeAt(0);
            if (!el.contains(range.startContainer) || !el.contains(range.endContainer)) return null;
            const start = getTextWithBreaks(el, range.startContainer, range.startOffset).length;
            const end = getTextWithBreaks(el, range.endContainer, range.endOffset).length;
            return { start: Math.min(start, end), end: Math.max(start, end) };
        }

        // 將字元位移換算回 DOM 中對應的節點與位置（getSelectionOffsets 的反向操作）
        function findPositionAtOffset(container, targetOffset) {
            let remaining = targetOffset;
            let found = null;
            function walk(node) {
                const children = node.childNodes;
                for (let i = 0; i < children.length; i++) {
                    if (found) return;
                    const child = children[i];
                    if (child.nodeType === 3) {
                        const len = child.textContent.length;
                        if (remaining <= len) { found = { node: child, offset: remaining }; return; }
                        remaining -= len;
                    } else if (child.nodeName === 'BR') {
                        if (remaining <= 0) { found = { node: node, offset: i }; return; }
                        remaining -= 1;
                    } else {
                        walk(child);
                    }
                }
            }
            walk(container);
            return found || { node: container, offset: container.childNodes.length };
        }

        // 依先前記錄的字元位移，重建出對應的選取範圍
        function setSelectionFromOffsets(el, offsets) {
            if (!offsets || offsets.start === offsets.end) return false;
            const startPos = findPositionAtOffset(el, offsets.start);
            const endPos = findPositionAtOffset(el, offsets.end);
            const range = document.createRange();
            try {
                range.setStart(startPos.node, startPos.offset);
                range.setEnd(endPos.node, endPos.offset);
            } catch (e) {
                return false;
            }
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            return true;
        }

        // 若目前選取範圍已失效（被上一次格式指令收合），改用記錄下來的範圍還原反選狀態
        function ensureFormatSelection(targetId) {
            const el = document.getElementById(targetId);
            const sel = window.getSelection();
            const liveOk = sel.rangeCount > 0 && !sel.isCollapsed &&
                el.contains(sel.getRangeAt(0).startContainer) && el.contains(sel.getRangeAt(0).endContainer);
            if (liveOk) return true;
            return setSelectionFromOffsets(el, formatSelectionOffsets[targetId]);
        }

        // 記錄目前這一次「有效的反選範圍」，供下一次連續點選工具列時使用
        function captureFormatSelection(targetId) {
            const el = document.getElementById(targetId);
            const offsets = getSelectionOffsets(el);
            if (offsets && offsets.start !== offsets.end) {
                formatSelectionOffsets[targetId] = offsets;
            }
        }

        function hexToHsl(hex) {
            const r = parseInt(hex.substr(1, 2), 16) / 255, g = parseInt(hex.substr(3, 2), 16) / 255, b = parseInt(hex.substr(5, 2), 16) / 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            if (max === min) { h = s = 0; }
            else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    default: h = (r - g) / d + 4;
                }
                h /= 6;
            }
            return [h * 360, s * 100, l * 100];
        }
        function hslToHex(h, s, l) {
            s /= 100; l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
            return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
        }
        const THEME_BASE_COLORS = ['#44546A', '#5B9BD5', '#ED7D31', '#A5A5A5', '#FFC000', '#4472C4', '#70AD47', '#264478', '#9E480E', '#636363'];
        const STANDARD_COLORS = ['#C00000', '#FF0000', '#FFC000', '#FFFF00', '#92D050', '#00B050', '#00B0F0', '#0070C0', '#002060', '#7030A0'];
        function generateThemeColumn(hex) {
            const [h, s] = hexToHsl(hex);
            return [85, 65, 50, 35, 20].map(l => hslToHex(h, s, l));
        }
        function makeSwatchBtn(color) {
            const btn = document.createElement('button');
            btn.className = 'color-swatch';
            btn.style.background = color;
            btn.title = color;
            btn.onclick = () => applyColorChoice(color);
            return btn;
        }
        function buildColorPanelContent() {
            const themeGrid = document.getElementById('colorPanelTheme');
            themeGrid.innerHTML = '';
            const columns = THEME_BASE_COLORS.map(generateThemeColumn);
            for (let row = 0; row < 5; row++) {
                for (let col = 0; col < 10; col++) {
                    themeGrid.appendChild(makeSwatchBtn(columns[col][row]));
                }
            }
            const standardRow = document.getElementById('colorPanelStandard');
            standardRow.innerHTML = '';
            STANDARD_COLORS.forEach(c => standardRow.appendChild(makeSwatchBtn(c)));
        }
        function getRecentColors() {
            try { return JSON.parse(localStorage.getItem('richTextRecentColors') || '[]'); } catch (e) { return []; }
        }
        function addRecentColor(hex) {
            let recent = getRecentColors().filter(c => c.toLowerCase() !== hex.toLowerCase());
            recent.unshift(hex);
            localStorage.setItem('richTextRecentColors', JSON.stringify(recent.slice(0, 12)));
        }
        function renderRecentColors() {
            const recent = getRecentColors();
            const section = document.getElementById('colorPanelRecentSection');
            const row = document.getElementById('colorPanelRecent');
            row.innerHTML = '';
            if (recent.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            recent.forEach(c => row.appendChild(makeSwatchBtn(c)));
        }

        function positionFloatingPanel(panel, anchorBtn) {
            panel.style.maxHeight = '';
            panel.style.visibility = 'hidden';
            panel.style.display = 'block';
            const rect = anchorBtn.getBoundingClientRect();
            const panelRect = panel.getBoundingClientRect();
            const vw = window.innerWidth, vh = window.innerHeight;
            let top = rect.bottom + 4;
            if (top + panelRect.height > vh - 8) {
                top = rect.top - panelRect.height - 4;
                if (top < 8) {
                    top = 8;
                    panel.style.maxHeight = (vh - 16) + 'px';
                }
            }
            let left = rect.left;
            if (left + panelRect.width > vw - 8) left = vw - panelRect.width - 8;
            if (left < 8) left = 8;
            panel.style.top = top + 'px';
            panel.style.left = left + 'px';
            panel.style.visibility = 'visible';
        }

        function openColorPanel(btn, mode, targetId) {
            const el = document.getElementById(targetId);
            el.focus();
            if (!ensureFormatSelection(targetId)) {
                alert('請先選取要套用顏色的文字');
                return;
            }
            const sel = window.getSelection();
            savedRange = sel.getRangeAt(0).cloneRange();
            colorPanelMode = mode;
            colorPanelTargetId = targetId;
            buildColorPanelContent();
            renderRecentColors();
            positionFloatingPanel(document.getElementById('colorPanel'), btn);
        }

        function closeColorPanel() {
            document.getElementById('colorPanel').style.display = 'none';
            savedRange = null;
        }

        function wrapSelectionWithStyle(cssProp, value) {
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            const frag = range.extractContents();
            const span = document.createElement('span');
            span.style[cssProp] = value;
            span.appendChild(frag);
            range.insertNode(span);
            sel.removeAllRanges();
        }

        function removeStyleFromSelection(cssProp) {
            const sel = window.getSelection();
            if (sel.rangeCount === 0) return;
            const range = sel.getRangeAt(0);
            const frag = range.extractContents();
            const walker = document.createTreeWalker(frag, NodeFilter.SHOW_ELEMENT, null);
            const spansToUnwrap = [];
            let node;
            while (node = walker.nextNode()) {
                if (node.tagName === 'SPAN') {
                    node.style[cssProp] = '';
                    if (!node.getAttribute('style')) spansToUnwrap.push(node);
                }
            }
            spansToUnwrap.forEach(span => {
                const parent = span.parentNode;
                while (span.firstChild) parent.insertBefore(span.firstChild, span);
                parent.removeChild(span);
            });
            range.insertNode(frag);
            sel.removeAllRanges();
        }

        function updateColorBar(targetId, mode, color) {
            const prefix = targetId === 'noteContent' ? 'input' : 'edit';
            const barId = mode === 'color' ? `${prefix}TextColorBar` : `${prefix}BgColorBar`;
            const bar = document.getElementById(barId);
            if (bar) bar.style.background = color;
        }

        function restoreSavedSelection(targetId) {
            const el = document.getElementById(targetId);
            el.focus();
            const sel = window.getSelection();
            sel.removeAllRanges();
            if (savedRange) sel.addRange(savedRange);
            return sel;
        }

        function applyColorChoice(value) {
            if (!savedRange || !colorPanelTargetId) return;
            const sel = restoreSavedSelection(colorPanelTargetId);
            if (sel.rangeCount === 0) return;

            if (value === 'auto') {
                removeStyleFromSelection(colorPanelMode);
            } else {
                wrapSelectionWithStyle(colorPanelMode, value);
                updateColorBar(colorPanelTargetId, colorPanelMode, value);
            }
            captureFormatSelection(colorPanelTargetId);
            closeColorPanel();
        }

        function handleNativeColorPick(e) {
            const color = e.target.value;
            addRecentColor(color);
            applyColorChoice(color);
        }

        // ===== Phase 3：核取方塊（□）與自動編號清單 =====
        let numberingPanelTargetId = null;

        // 在「該行最前面」插入清單標記文字（核取方塊或編號），若游標當時不在行首、
        // 該行已有內容，仍會把標記插到行首，並讓游標回到原本相對於文字的位置
        function insertLineMarkerAtFront(targetId, markerText) {
            const el = document.getElementById(targetId);
            el.focus();
            const sel = window.getSelection();
            if (sel.rangeCount === 0) { document.execCommand('insertText', false, markerText); return; }
            if (!sel.isCollapsed) sel.collapseToStart();
            const range = sel.getRangeAt(0);
            if (!el.contains(range.startContainer)) { document.execCommand('insertText', false, markerText); return; }

            const lineInfo = getCurrentLineText(el, range.startContainer, range.startOffset);
            const prefixLen = lineInfo.linePrefix.length;

            for (let i = 0; i < prefixLen; i++) sel.modify('move', 'backward', 'character');
            document.execCommand('insertText', false, markerText);
            for (let i = 0; i < prefixLen; i++) sel.modify('move', 'forward', 'character');
        }

        // 在游標（或選取範圍）處插入核取方塊符號
        function insertChecklistMarker(targetId) {
            insertLineMarkerAtFront(targetId, '□\u00A0');
        }

        function openNumberingPanel(btn, targetId) {
            const el = document.getElementById(targetId);
            el.focus();
            numberingPanelTargetId = targetId;
            document.getElementById('colorPanel').style.display = 'none';
            positionFloatingPanel(document.getElementById('numberingPanel'), btn);
        }

        function closeNumberingPanel() {
            document.getElementById('numberingPanel').style.display = 'none';
            numberingPanelTargetId = null;
        }

        // 套用選擇的編號格式，於該行行首插入第一個編號
        function applyNumberingFormat(type) {
            if (!numberingPanelTargetId) { closeNumberingPanel(); return; }
            const marker = type === 'abc' ? 'a.\u00A0' : (type === 'paren' ? '(1)\u00A0' : '1.\u00A0');
            insertLineMarkerAtFront(numberingPanelTargetId, marker);
            closeNumberingPanel();
        }

        // 走訪 contenteditable 內容，將 <br> 視為換行符 '\n'，回傳從頭到指定節點/位置為止的文字
        function getTextWithBreaks(container, stopNode, stopOffset) {
            let result = '';
            let done = false;
            function walk(node) {
                if (done) return;
                if (node.nodeType === 3) {
                    if (node === stopNode) {
                        result += node.textContent.slice(0, stopOffset);
                        done = true;
                    } else {
                        result += node.textContent;
                    }
                    return;
                }
                if (node.nodeName === 'BR') {
                    result += '\n';
                    if (node === stopNode) done = true;
                    return;
                }
                const children = node.childNodes;
                for (let i = 0; i < children.length; i++) {
                    if (node === stopNode && i === stopOffset) { done = true; return; }
                    walk(children[i]);
                    if (done) return;
                }
                if (node === stopNode && stopOffset >= children.length) done = true;
            }
            walk(container);
            return result;
        }

        // 取得游標所在那一行的文字（游標前段、游標後段、整行）
        function getCurrentLineText(el, caretNode, caretOffset) {
            const beforeCaret = getTextWithBreaks(el, caretNode, caretOffset);
            const fullText = getTextWithBreaks(el, el, el.childNodes.length);
            const afterCaret = fullText.slice(beforeCaret.length);
            const linePrefix = beforeCaret.split('\n').pop();
            const lineSuffix = afterCaret.split('\n')[0];
            return { linePrefix, lineSuffix, fullLine: linePrefix + lineSuffix };
        }

        // 偵測一行開頭是否為核取方塊或編號清單標記
        function matchListMarker(text) {
            // 空白字元可能是一般空格，也可能被瀏覽器轉成不斷行空格（&nbsp;），兩種都要接受
            const patterns = [
                { type: 'checkbox', regex: /^□[ \u00A0]/ },
                { type: 'abc', regex: /^([a-zA-Z])\.[ \u00A0]/ },
                { type: 'paren', regex: /^\((\d+)\)[ \u00A0]/ },
                { type: 'arabic', regex: /^(\d+)\.[ \u00A0]/ }
            ];
            for (const p of patterns) {
                const m = text.match(p.regex);
                if (m) return { type: p.type, text: m[0], match: m };
            }
            return null;
        }

        // 根據目前的清單標記，算出下一行該接續的標記
        function getNextMarker(marker) {
            switch (marker.type) {
                case 'checkbox':
                    return '□\u00A0';
                case 'abc': {
                    const letter = marker.match[1];
                    const isUpper = letter === letter.toUpperCase();
                    let code = letter.toLowerCase().charCodeAt(0) + 1;
                    if (code > 122) code = 97; // 超過 z 就回到 a
                    let next = String.fromCharCode(code);
                    if (isUpper) next = next.toUpperCase();
                    return next + '.\u00A0';
                }
                case 'paren': {
                    const num = parseInt(marker.match[1], 10) + 1;
                    return '(' + num + ')\u00A0';
                }
                case 'arabic': {
                    const num = parseInt(marker.match[1], 10) + 1;
                    return num + '.\u00A0';
                }
            }
        }

        // 刪除目前這一行、從行首到游標為止的內容（用來移除清單標記）
        function removeLinePrefixAtCaret(charCount) {
            const sel = window.getSelection();
            for (let i = 0; i < charCount; i++) {
                sel.modify('extend', 'backward', 'character');
            }
            document.execCommand('delete', false, null);
        }

        // 在核取方塊 / 編號清單中按下 Enter 時的接續或結束行為
        function handleListEnterKey(e, targetId) {
            if (e.key !== 'Enter' || e.shiftKey) return;
            const el = document.getElementById(targetId);
            const sel = window.getSelection();
            if (sel.rangeCount === 0 || !sel.isCollapsed) return;
            const range = sel.getRangeAt(0);
            if (!el.contains(range.startContainer)) return;

            const lineInfo = getCurrentLineText(el, range.startContainer, range.startOffset);
            const marker = matchListMarker(lineInfo.fullLine);
            if (!marker) return; // 非清單行，交給預設 Enter 行為

            e.preventDefault();

            const contentAfterMarker = lineInfo.fullLine.slice(marker.text.length).trim();
            if (contentAfterMarker === '') {
                // 該行只有標記、沒有其他內容：按 Enter 直接刪除標記，退出清單
                removeLinePrefixAtCaret(lineInfo.linePrefix.length);
            } else {
                // 該行已輸入內容：換行並接續下一個標記
                const nextMarker = getNextMarker(marker);
                document.execCommand('insertHTML', false, '<br>' + nextMarker);
            }
        }

        function sanitizeRichHtml(html) {
            const allowedTags = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'BR', 'SPAN', 'A', 'DIV', 'IMG']);
            const container = document.createElement('div');
            container.innerHTML = html;

            function clean(node) {
                [...node.childNodes].forEach(child => {
                    if (child.nodeType === 3) return; // 文字節點，保留
                    if (child.nodeType !== 1 || !allowedTags.has(child.tagName)) {
                        // 不是允許的標籤：保留裡面的文字/子節點，拿掉標籤本身
                        while (child.firstChild) node.insertBefore(child.firstChild, child);
                        node.removeChild(child);
                        return;
                    }
                    // 允許的標籤：清掉不需要的屬性
                    [...child.attributes].forEach(attr => {
                        if (child.tagName === 'SPAN' && attr.name === 'style') {
                            const allowedStyle = [];
                            const colorMatch = attr.value.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i);
                            const bgMatch = attr.value.match(/background-color\s*:\s*([^;]+)/i);
                            if (colorMatch) allowedStyle.push(`color:${colorMatch[1].trim()}`);
                            if (bgMatch) allowedStyle.push(`background-color:${bgMatch[1].trim()}`);
                            if (allowedStyle.length) child.setAttribute('style', allowedStyle.join(';'));
                            else child.removeAttribute('style');
                        } else if (child.tagName === 'A' && attr.name === 'href') {
                            // 保留
                        } else if (child.tagName === 'IMG' && attr.name === 'src') {
                            // 保留
                        } else if (child.tagName === 'IMG' && (attr.name === 'data-draw' || attr.name === 'data-w')) {
                            // 保留（手寫圖片標記）
                        } else {
                            child.removeAttribute(attr.name);
                        }
                    });
                    if (child.tagName === 'A') {
                        child.setAttribute('target', '_blank');
                        child.setAttribute('rel', 'noopener noreferrer');
                    }
                    if (child.tagName === 'IMG') {
                        const src = child.getAttribute('src') || '';
                        if (!/^https?:\/\//i.test(src)) { node.removeChild(child); return; }
                        child.setAttribute('class', child.getAttribute('data-draw') ? 'note-img inline-note-img inline-draw-img' : 'note-img inline-note-img');
                        const drawW = parseInt(child.getAttribute('data-w'), 10);
                        if (child.getAttribute('data-draw') && drawW > 0) child.setAttribute('style', 'width:' + Math.min(drawW, 2000) + 'px;');
                    }
                    clean(child);
                });
            }
            clean(container);
            return container.innerHTML;
        }

        // 讓富文字筆記的「第一行」維持加粗（第一個換行 <br> 或區塊 <div> 之前的內容）
        function boldFirstLineRich(html) {
            const container = document.createElement('div');
            container.innerHTML = html;

            function isBlankText(node) {
                return node.nodeType === 3 && node.textContent.replace(/[\s\u00A0]/g, '') === '';
            }
            function wrapFirstLine(parent) {
                let node = parent.firstChild;
                while (node) {
                    if (node.nodeName === 'BR' || isBlankText(node)) { node = node.nextSibling; continue; }
                    if (node.nodeName === 'DIV') {
                        if (wrapFirstLine(node)) return true;
                        node = node.nextSibling;
                        continue;
                    }
                    const span = document.createElement('span');
                    span.className = 'first-line-bold';
                    parent.insertBefore(span, node);
                    let cur = node;
                    while (cur && cur.nodeName !== 'BR' && cur.nodeName !== 'DIV') {
                        const next = cur.nextSibling;
                        span.appendChild(cur);
                        cur = next;
                    }
                    return true;
                }
                return false;
            }
            wrapFirstLine(container);
            return container.innerHTML;
        }

        function autoLinkPlainUrls(html) {
            const container = document.createElement('div');
            container.innerHTML = html;
            const urlRegex = /((https?:\/\/|www\.)[^\s<]+)/gi;

            function isInsideLink(node) {
                let p = node.parentNode;
                while (p) {
                    if (p.nodeType === 1 && p.tagName === 'A') return true;
                    p = p.parentNode;
                }
                return false;
            }

            function walk(node) {
                [...node.childNodes].forEach(child => {
                    if (child.nodeType === 3) {
                        if (isInsideLink(child)) return;
                        const text = child.textContent;
                        urlRegex.lastIndex = 0;
                        if (!urlRegex.test(text)) return;
                        urlRegex.lastIndex = 0;
                        const frag = document.createDocumentFragment();
                        let lastIndex = 0, match;
                        while ((match = urlRegex.exec(text)) !== null) {
                            if (match.index > lastIndex) frag.appendChild(document.createTextNode(text.substring(lastIndex, match.index)));
                            let href = match[0];
                            if (!/^https?:\/\//i.test(href)) href = 'https://' + href;
                            const a = document.createElement('a');
                            a.setAttribute('href', href);
                            a.textContent = match[0];
                            frag.appendChild(a);
                            lastIndex = match.index + match[0].length;
                        }
                        if (lastIndex < text.length) frag.appendChild(document.createTextNode(text.substring(lastIndex)));
                        child.parentNode.replaceChild(frag, child);
                    } else if (child.nodeType === 1) {
                        walk(child);
                    }
                });
            }
            walk(container);
            return container.innerHTML;
        }

        function formatReminderBadge(iso, repeat) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return '';
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            const mm = d.getMonth() + 1;
            const dd = d.getDate();
            const hh = String(d.getHours()).padStart(2, '0');
            const mi = String(d.getMinutes()).padStart(2, '0');
            const wd = weekDays[d.getDay()];
            const repeatMap = { daily: '每天', weekly: '每週', monthly: '每月' };
            const repeatLabel = repeatMap[repeat] || '';
            return `${mm}/${dd}(${wd}) ${hh}:${mi}${repeatLabel ? `<span class="reminder-badge-tag">${repeatLabel}</span>` : ''}`;
        }

        function secretaryNoteIsMultiline(note) {

            return `

        // ===== 個人秘書：長按拖曳排序（手機長按、電腦滑鼠按住皆可）=====
        const SEC_LONG_PRESS_MS = 400;
        const SEC_MOVE_TOLERANCE = 8;
        let secDrag = null;            // { item, startX, startY, lastY, active, timer }
        let secAutoScrollTimer = null;
        let secLastTouchTime = 0;

        function secOnPress(e, x, y) {
            const target = e.target;
            if (!target || !target.closest) return;
            if (target.closest('button, a, input, textarea, select, .yt-preview-container')) return;
            const item = target.closest('.secretary-item');
            if (!item) return;
            if (document.querySelectorAll('#secretaryList .secretary-item').length < 2) return;
            secDragReset();
            secDrag = { item: item, startX: x, startY: y, lastY: y, active: false, timer: null };
            secDrag.timer = setTimeout(secDragActivate, SEC_LONG_PRESS_MS);
        }

        function secDragActivate() {
            if (!secDrag) return;
            secDrag.timer = null;
            secDrag.active = true;
            secDrag.item.classList.add('sec-dragging');
            document.body.classList.add('sec-no-select');
            const sel = window.getSelection && window.getSelection();
            if (sel) sel.removeAllRanges();
            if (navigator.vibrate) { try { navigator.vibrate(30); } catch (err) {} }
            secAutoScrollTimer = setInterval(secAutoScroll, 16);
        }

        function secOnMove(x, y) {
            if (!secDrag) return;
            if (!secDrag.active) {
                // 還沒進入拖曳就移動太多 → 視為一般捲動，取消長按
                if (Math.abs(x - secDrag.startX) > SEC_MOVE_TOLERANCE || Math.abs(y - secDrag.startY) > SEC_MOVE_TOLERANCE) secDragReset();
                return;
            }
            secDrag.lastY = y;
            secReorderByY(y);
        }

        function secReorderByY(y) {
            if (!secDrag || !secDrag.active) return;
            const list = document.getElementById('secretaryList');
            const dragged = secDrag.item;
            const others = Array.from(list.querySelectorAll('.secretary-item')).filter(el => el !== dragged);
            let before = null;
            for (const el of others) {
                const r = el.getBoundingClientRect();
                if (y < r.top + r.height / 2) { before = el; break; }
            }
            if (before) {
                if (dragged.nextElementSibling !== before) list.insertBefore(dragged, before);
            } else if (others.length > 0) {
                const last = others[others.length - 1];
                if (last.nextElementSibling !== dragged) list.insertBefore(dragged, last.nextSibling);
            }
        }

        function secAutoScroll() {
            if (!secDrag || !secDrag.active) return;
            const header = document.getElementById('mainHeader');
            const topEdge = (header && header.style.display !== 'none' ? header.getBoundingClientRect().bottom : 0) + 30;
            const bottomEdge = window.innerHeight - 60;
            const y = secDrag.lastY;
            let dy = 0;
            if (y < topEdge) dy = -10;
            else if (y > bottomEdge) dy = 10;
            if (dy !== 0) {
                window.scrollBy(0, dy);
                secReorderByY(y);
            }
        }

        function secDragReset() {
            if (!secDrag) return;
            if (secDrag.timer) clearTimeout(secDrag.timer);
            if (secAutoScrollTimer) { clearInterval(secAutoScrollTimer); secAutoScrollTimer = null; }
            secDrag.item.classList.remove('sec-dragging');
            document.body.classList.remove('sec-no-select');
            secDrag = null;
        }

        function secOnRelease() {
            if (!secDrag) return;
            const wasActive = secDrag.active;
            if (wasActive) {
                const ids = Array.from(document.querySelectorAll('#secretaryList .secretary-item')).map(el => el.dataset.id);

        function initSecretaryDrag() {
            const list = document.getElementById('secretaryList');

            list.addEventListener('touchstart', (e) => {
                secLastTouchTime = Date.now();
                if (e.touches.length !== 1) { secDragReset(); return; }
                const t = e.touches[0];
                secOnPress(e, t.clientX, t.clientY);
            }, { passive: true });
            list.addEventListener('touchmove', (e) => {
                secLastTouchTime = Date.now();
                if (!secDrag) return;
                if (secDrag.active && e.cancelable) e.preventDefault(); // 拖曳中不要讓頁面跟著捲動
                const t = e.touches[0];
                secOnMove(t.clientX, t.clientY);
            }, { passive: false });
            list.addEventListener('touchend', () => { secLastTouchTime = Date.now(); secOnRelease(); });
            list.addEventListener('touchcancel', () => { secLastTouchTime = Date.now(); secOnRelease(); });

            list.addEventListener('mousedown', (e) => {
                if (e.button !== 0 || Date.now() - secLastTouchTime < 800) return; // 略過觸控後瀏覽器補發的滑鼠事件
                secOnPress(e, e.clientX, e.clientY);
            });
            window.addEventListener('mousemove', (e) => secOnMove(e.clientX, e.clientY));
            window.addEventListener('mouseup', secOnRelease);

            // 長按時不要跳出系統選單
            list.addEventListener('contextmenu', (e) => { if (secDrag) e.preventDefault(); });
        }

            if (!newName || newName.trim() === currentName) return;
            const targetName = newName.trim();

            if (categories.some(c => c.name === targetName)) { alert('目標分類名稱已存在'); return; }

            const catObj = categories.find(c => c.name === currentName);
            if (catObj) {
                dbCat.child(catObj.id).update({ name: targetName });
            }

            notes.forEach(note => {
                if (note.category === currentName) {
                    db.child(note.id).update({ category: targetName });
                }
            });

            if (activeCategoryFilter === currentName) activeCategoryFilter = targetName;
            if (document.getElementById('searchCategoryFilter').value === currentName) {
                document.getElementById('searchCategoryFilter').value = targetName;
            }
            alert('分類及相關筆記已連動更新完成');
        }

            if (!currentName) { alert('請先選擇要刪除的分類'); return; }
            if (!confirm(`確定要刪除分類【${currentName}】嗎？\n注意：現有筆記中的此分類標籤會被移除。`)) return;

            const catObj = categories.find(c => c.name === currentName);
            if (catObj) {
                dbCat.child(catObj.id).remove();
            }

            notes.forEach(note => {
                if (note.category === currentName) {
                    db.child(note.id).update({ category: '' });

            if (document.getElementById('searchCategoryFilter').value === currentName) {

        function onSearchInput() {
            currentPage = 1;
            executeFilter();
